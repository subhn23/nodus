name: nodus_core
description: Pure Dart core engine for Nodus (Entities, Repositories, Drift DB, CAS, SecretGuard, Task Parser).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
resolution: workspace

dependencies:
  drift: ^2.22.0
  sqlite3: ^2.4.6
  crypto: ^3.0.3
  uuid: ^4.5.1
  equatable: ^2.0.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  path: ^1.9.0

dev_dependencies:
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
