name: nodus
description: "A sovereign, local-first technical workspace and note-taking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

workspace:
  - packages/nodus_core
  - packages/nodus_mcp

dependencies:
  flutter:
    sdk: flutter
  nodus_core:

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  get_it: ^8.0.2
  window_manager: ^0.4.3
  multi_split_view: ^3.5.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.12
  flutter_secure_storage: ^9.2.2
  image: ^4.3.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
